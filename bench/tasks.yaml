# Routing benchmark task suite.
#
# Each task carries a reference trajectory expressed as a PARTIAL order, not a
# fixed sequence. Some steps genuinely have to precede others (you cannot fetch
# weather before you have coordinates); the rest are order-free, and scoring a
# model wrong for choosing a different valid order would be measuring style
# rather than correctness.
#
# Every prompt asks for exactly what required_tools covers, no more and no
# less: a model that does what it was asked must be able to score complete.
#
# fields:
#   required_tools  tools that must appear for the task to be complete
#   dependencies    tool -> tools that must appear BEFORE it
#   forbidden_tools tools that indicate the model misread the request
#   param_checks    substring/number assertions on the arguments actually passed.
#                   When geocode_location has a location check, the scorer also
#                   checks every lat/lon argument against that city's coordinates.

- id: T01
  depth: 2
  prompt: "What's the cloud cover looking like in Austin over the next 12 hours?"
  required_tools: [geocode_location, get_weather_conditions]
  dependencies: {get_weather_conditions: [geocode_location]}
  forbidden_tools: [save_session_plan]
  param_checks:
    geocode_location: {location: austin}

